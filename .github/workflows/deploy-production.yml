name: Deploy production

# Manual-only. Pick the branch/tag in the "Run workflow" dropdown; the
# selected ref is what gets built and deployed to streamour.net.
#
# Runs on the self-hosted runner that lives on the home server
# (avinhsdell), so no SSH or secrets are needed — the runner has local
# access to the deploy dir and the docker socket. Mirrors task-app's
# deploy.yml, except it is not triggered by push.

on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  # Let in-flight builds finish — cancelling mid-build can leave a half-built
  # image on disk and a degraded compose state.
  cancel-in-progress: false

env:
  DEPLOY_DIR: /home/avinh/streamour
  PORT: 3000

jobs:
  deploy:
    runs-on: [self-hosted, streamour]
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Show what is being deployed
        run: |
          echo "ref:    ${{ github.ref_name }}"
          echo "commit: ${{ github.sha }}"
          echo "version: $(node -p "require('./package.json').version")"

      - name: Sync source to deploy dir
        # rsync from the runner's checkout into the real deploy dir. The
        # excludes preserve the prod .env (which lives only on the box) and
        # local-only artifacts (regenerated by `docker compose build`). Keep the
        # leading slash on every exclude: without it rsync matches the name at
        # any depth, and 'media/' silently skipped app/api/media/ (#56).
        run: |
          mkdir -p "$DEPLOY_DIR"
          rsync -az --delete \
            --exclude='/.env' \
            --exclude='/.env*.local' \
            --exclude='/.git/' \
            --exclude='/node_modules/' \
            --exclude='/.next/' \
            --exclude='/media/' \
            "${{ github.workspace }}/" "$DEPLOY_DIR/"

      - name: Ensure database password
        # First deploy with the Postgres container: generate a password into
        # the box-only .env. Never regenerated afterwards (the database volume
        # is initialised with it).
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          if ! grep -q '^POSTGRES_PASSWORD=' .env; then
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)" >> .env
            echo "generated POSTGRES_PASSWORD"
          fi

      - name: Build + restart
        working-directory: ${{ env.DEPLOY_DIR }}
        run: docker compose -p streamour up -d --build

      - name: Smoke test
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          # The container applies database migrations before it starts
          # listening, so poll instead of sleeping. /api/health returns 200
          # only when the app is up and can reach the database.
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 8 "http://127.0.0.1:${PORT}/api/health" || true)
            [ "$code" = "200" ] && break
            sleep 2
          done
          docker compose -p streamour ps
          echo "status: $code"
          if [ "$code" != "200" ]; then
            docker compose -p streamour logs --tail 50 streamour
            exit 1
          fi

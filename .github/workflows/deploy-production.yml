name: Deploy production

# Manual-only. Pick the branch/tag in the "Run workflow" dropdown; the
# selected ref is what gets built and deployed to streamour.net.
#
# Runs on the self-hosted runner that lives on the home server
# (avinhsdell), so no SSH or secrets are needed — the runner has local
# access to the deploy dir and the docker socket. Mirrors task-app's
# deploy.yml, except it is not triggered by push.

on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  # Let in-flight builds finish — cancelling mid-build can leave a half-built
  # image on disk and a degraded compose state.
  cancel-in-progress: false

env:
  DEPLOY_DIR: /home/avinh/streamour
  PORT: 3000

jobs:
  deploy:
    runs-on: [self-hosted, streamour]
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Show what is being deployed
        run: |
          echo "ref:    ${{ github.ref_name }}"
          echo "commit: ${{ github.sha }}"
          echo "version: $(node -p "require('./package.json').version")"

      - name: Sync source to deploy dir
        # rsync from the runner's checkout into the real deploy dir. The
        # excludes preserve the prod .env (which lives only on the box) and
        # local-only artifacts (regenerated by `docker compose build`).
        run: |
          mkdir -p "$DEPLOY_DIR"
          rsync -az --delete \
            --exclude='.env' \
            --exclude='.env*.local' \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude='.next/' \
            --exclude='media/' \
            "${{ github.workspace }}/" "$DEPLOY_DIR/"

      - name: Build + restart
        working-directory: ${{ env.DEPLOY_DIR }}
        run: docker compose -p streamour up -d --build

      - name: Smoke test
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          # Give the container a few seconds to bind the port, then make
          # sure it responds. Unauthenticated requests to / redirect to
          # /login, so a 200 or 307 both mean "alive."
          sleep 5
          docker compose -p streamour ps
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 8 "http://127.0.0.1:${PORT}/")
          echo "status: $code"
          case "$code" in 200|307) echo "ok"; exit 0 ;; *) echo "unexpected"; exit 1 ;; esac

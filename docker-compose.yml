name: streamour

services:
  streamour:
    build: .
    container_name: streamour
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      - AUTH_PASSWORD=${AUTH_PASSWORD:?AUTH_PASSWORD is required}
      - MEDIA_DIR=/media
      # Inside the compose network the database host is "postgres".
      - DATABASE_URL=postgresql://streamour:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/streamour
      # First owner account, created at the first sign-in.
      - OWNER_EMAIL=${OWNER_EMAIL:-}
      # Transitional: AUTH_PASSWORD signs in as the owner while this is not "false".
      - LEGACY_PASSWORD_LOGIN=${LEGACY_PASSWORD_LOGIN:-true}
      # Set to "true" only when serving over plain HTTP (cookies lose Secure).
      - COOKIE_INSECURE=${COOKIE_INSECURE:-}
      # Outbound email (lib/mail.ts). "log" prints emails to the container log.
      - MAIL_PROVIDER=${MAIL_PROVIDER:-log}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - MAIL_FROM=${MAIL_FROM:-Streamour <no-reply@streamour.net>}
      # Public base URL, used for links in emails.
      - APP_URL=${APP_URL:-http://localhost:3000}
    volumes:
      - ${MEDIA_PATH:?MEDIA_PATH is required}:/media:ro
      # Generated HLS and thumbnails. A named volume by default; set CACHE_PATH
      # to a host directory (writable by uid 1001) to keep it on a bigger disk.
      - ${CACHE_PATH:-cache}:/cache
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Migrations run before the server starts listening.
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    container_name: streamour-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=streamour
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_DB=streamour
    ports:
      # Host-local only, for psql and local development. Not exposed to the LAN.
      - "127.0.0.1:${POSTGRES_PORT:-5436}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamour -d streamour"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
  cache:
